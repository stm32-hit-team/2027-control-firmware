; platformio.ini —— 构建配置。
;
; stm32f103c6             默认。板上是 C6T6，32K Flash。
; stm32f103c8             备用。C8 是 64K Flash，不要刷到 C6 上。
; stm32f103c6_motor_check 打开电机 PWM，只在测电机时用。
; 嘉立创 .tel 网表只写了 U11 的 LQFP-48 封装，没有料号。

[platformio]
default_envs = stm32f103c6

[common]
build_flags =
  -std=c11
  -Wall
  -Wextra
  -Wshadow
  -Wno-unused-parameter
extra_scripts = pre:extra_script.py

; upload_protocol 用 stlink，对应 SWD 口上的 ST-Link。
; 换 CMSIS-DAP 要把这一行改成 cmsis-dap。
[env]
platform = ststm32@19.5.0
framework = stm32cube
upload_protocol = stlink
build_flags = ${common.build_flags}

[env:stm32f103c8]
board = genericSTM32F103C8
debug_tool = stlink
debug_build_flags = -O0 -g3

[env:stm32f103c6]
board = genericSTM32F103C6
debug_tool = stlink
debug_build_flags = -O0 -g3

[env:stm32f103c8_motor_check]
board = genericSTM32F103C8
build_flags =
  ${common.build_flags}
  -DAPP_ENABLE_MOTOR=1

[env:stm32f103c6_motor_check]
board = genericSTM32F103C6
build_flags =
  ${common.build_flags}
  -DAPP_ENABLE_MOTOR=1
