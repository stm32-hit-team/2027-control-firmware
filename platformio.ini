; platformio.ini —— 构建配置。
;
; stm32f103c8             默认。网表上的 MCU 是 C8T6，64K Flash。
; stm32f103c6             备用。C6 只有 32K Flash。
; stm32f103c8_motor_check 打开电机 PWM，只在测电机时用。

[platformio]
default_envs = stm32f103c8

[common]
build_flags =
  -std=c11
  -Wall
  -Wextra
  -Wshadow
  -Wno-unused-parameter
extra_scripts = pre:extra_script.py

; upload_protocol 用 cmsis-dap，对应 SWD 口上的下载器。
; 换 ST-Link 要把这一行改成 stlink。
[env]
platform = ststm32@19.5.0
framework = stm32cube
upload_protocol = cmsis-dap
build_flags = ${common.build_flags}

[env:stm32f103c8]
board = genericSTM32F103C8
debug_tool = stlink
debug_build_flags = -O0 -g3

[env:stm32f103c6]
board = genericSTM32F103C6
debug_tool = stlink
debug_build_flags = -O0 -g3

[env:stm32f103c8_motor_check]
board = genericSTM32F103C8
build_flags =
  ${common.build_flags}
  -DAPP_ENABLE_MOTOR=1

[env:stm32f103c6_motor_check]
board = genericSTM32F103C6
build_flags =
  ${common.build_flags}
  -DAPP_ENABLE_MOTOR=1
